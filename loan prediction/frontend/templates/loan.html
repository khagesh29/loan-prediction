<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Application Status</title>

  <!-- ✅ CORRECT CSS PATH -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/loan.css') }}">
</head>
<body>

  <div class="loan-status-banner">
    <h1>PREDICT LOAN APPLICATION</h1>
  </div>

  <div class="loan-container">

    <label>Loan Product Name</label>
    <input type="text" id="product" placeholder="e.g. Home Loan">

    <label>Applicant Name</label>
    <input type="text" id="name" placeholder="Enter full name">

    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="Enter 10-digit number"
           maxlength="10" pattern="[0-9]{10}">

    <label>Gender</label>
    <select id="gender">
      <option value="Female">Female</option>
      <option value="Male">Male</option>
    </select>

    <label>Marital Status</label>
    <select id="marital">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <label>Education</label>
    <select id="education">
      <option value="Not Graduate">Not Graduate</option>
      <option value="Graduate">Graduate</option>
    </select>

    <label>Employment Status</label>
    <select id="employment">
      <option value="Salaried">Salaried</option>
      <option value="Self Employed">Self Employed</option>
      <option value="Unemployed">Unemployed</option>
    </select>

    <label>Credit Score Range</label>
    <select id="credit">
      <option value="300-500">300–500</option>
      <option value="501-650">501–650</option>
      <option value="651-750">651–750</option>
      <option value="751-850">751–850</option>
    </select>

    <label>Applicant Monthly Income (₹)</label>
    <input type="number" id="income" placeholder="Enter income">

    <label>Loan Amount (₹)</label>
    <input type="number" id="loan_amount" placeholder="Enter loan amount">

    <label>Loan Duration (Months)</label>
    <input type="number" id="duration" placeholder="e.g. 36">

    <button type="button" id="submit-btn">Predict Loan Status</button>

    <div id="loan-status"></div>

  </div>

  <!-- ✅ CORRECT JS PATH -->
  <script src="{{ url_for('static', filename='js/loan.js') }}"></script>
</body>
</html>
